[project]
name = "commap"
version = "0.1.0"
description = "The communication map of a transformer: weight-derived, FDR-controlled connectivity graphs from GPT-2 to Pythia-6.9B."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "torch>=2.6",
    "transformer-lens>=2.0",
    "tqdm>=4.66",
    "datasets>=2.19",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments/lib/commap"]

# On Linux, resolve torch from the CUDA 12.8 index (the RTX 5090 is
# sm_120 Blackwell and needs torch >= 2.7 with cu128):
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

